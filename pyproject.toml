[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e2seq"
version = "0.2.0"
description = "E2seq - Easy to Chat with Sequencing via Agentic RAG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "E2seq Team", email = "team@e2seq.dev"}
]
keywords = ["single-cell", "bioinformatics", "RAG", "AI", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "scanpy>=1.9.0",
    "anndata>=0.9.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.6",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "gseapy>=1.0.0",
    "networkx>=3.1",
    "igraph>=0.10.0",
    "pyvis>=0.3.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "langchain-community>=0.0.20",
    "chromadb>=0.4.0",
    "rank_bm25>=0.0.0",
    "sentence-transformers>=2.2.0",
    "huggingface-hub>=1.0.0",
    "flashrank>=0.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "filelock>=3.12.0",
    "cryptography>=41.0.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]
rds = [
    "pyreadr>=0.5.0",
]

[project.scripts]
e2seq = "e2seq.cli.app:main"

[project.urls]
Homepage = "https://github.com/XIAOJIE0519/E2seq"
Documentation = "https://github.com/XIAOJIE0519/E2seq#readme"
Repository = "https://github.com/XIAOJIE0519/E2seq"
Issues = "https://github.com/XIAOJIE0519/E2seq/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["e2seq*", "api*", "database*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
e2seq = [
    "web/static/favicon.ico",
    "web/static/favicon.png",
    "web/static/css/*",
    "web/static/css/lib/*",
    "web/static/js/*",
    "web/static/js/lib/*",
    "web/static/templates/*",
    "web/templates/*",
    "databases/*.db",
    "config/*.yaml",
    "prompts/*.txt",
]
database = ["*.csv", "*.db"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
